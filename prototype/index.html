<!doctype html>
<html lang="en-GH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C2757">
<title>Kasa · Merchant dashboard (prototype)</title>
<style>
:root{
  --cotton:#F5EFE3; --paper:#FFFCF5; --sunk:#EDE5D4; --ink:#1D1A15; --muted:#62594B; --line:#E0D5C1; --line-2:#CDBFA6;
  --indigo:#1C2757; --indigo-2:#26346F; --indigo-3:#3A4A93; --indigo-soft:#E2E5F3; --indigo-text:#26346F;
  --on-indigo:#EEECF7; --on-indigo-muted:#B1B8DC;
  --ochre:#C4860F; --ochre-soft:#F6E4B8; --ochre-ink:#6B4500;
  --leaf:#2E7343; --leaf-soft:#D8EBD4; --leaf-ink:#1D4F2D;
  --fault:#A8281F; --fault-soft:#F6DBD6;
  --bubble-out:#DCEFD0; --chat-ground:#EFE8DA;
  --cap:"Bahnschrift SemiCondensed","Bahnschrift","Roboto Condensed","Arial Narrow",system-ui,sans-serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:12px; --r-s:8px;
  --lift:0 1px 2px rgba(45,32,8,.06),0 8px 24px -12px rgba(45,32,8,.22);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.45 var(--ui);color:var(--ink);background:var(--cotton);-webkit-font-smoothing:antialiased;caret-color:var(--indigo-3)}
::selection{background:var(--ochre-soft);color:var(--ink)}
a{color:var(--indigo-text);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ochre);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:var(--line-2) transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:var(--line-2);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
.num{font-variant-numeric:tabular-nums}
.cap{font-family:var(--cap);text-transform:uppercase;letter-spacing:.12em;font-weight:600}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100dvh;overflow:hidden}
.rail{background:var(--indigo);color:var(--on-indigo);display:flex;flex-direction:column;padding:18px 12px 14px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px 18px;text-decoration:none;color:inherit}
.brand b{font:700 24px/1 var(--cap);letter-spacing:.02em}
.org{margin:0 4px 16px;padding:10px 12px;border-radius:var(--r-s);background:var(--indigo-2)}
.org strong{display:block;font-size:14px}
.org span{font-size:12px;color:var(--on-indigo-muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:var(--r-s);color:var(--on-indigo-muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--indigo-2);color:var(--on-indigo)}
.nav a[aria-current=page]{background:var(--paper);color:var(--indigo)}
.nav .badge{margin-left:auto}
.rail-foot{margin-top:auto;padding:14px 10px 0;border-top:1px solid var(--indigo-3);font-size:13px;color:var(--on-indigo-muted)}
.rail-foot a{color:var(--on-indigo)}
.rail-foot .me{display:flex;align-items:center;gap:10px;margin-top:12px}
.main{display:flex;flex-direction:column;min-width:0;height:100dvh}
.mtop{display:none}
.scroll{flex:1;min-height:0;overflow-y:auto}
.view{padding:26px 30px 48px;max-width:1280px}
.tabs-m{display:none}

/* ---------- selvedge (signature) ---------- */
.selvedge{flex:none;background:var(--paper);border-bottom:3px double var(--line-2);overflow-x:auto;scrollbar-width:none}
.selvedge::-webkit-scrollbar{display:none}
.selv{display:flex;align-items:center;gap:14px;white-space:nowrap;padding:9px 30px;font:600 12px/1 var(--cap);letter-spacing:.15em;text-transform:uppercase;color:var(--indigo-text)}
.selv em{font-style:normal;color:var(--ochre-ink)}
.selv a{color:inherit;text-decoration:none}
.selv a:hover em{text-decoration:underline}
.selv i{width:5px;height:5px;background:var(--ochre);transform:rotate(45deg);flex:none}
.edge{display:flex;align-items:center;gap:12px;justify-content:space-between;padding:8px 14px;border-bottom:3px double var(--line);font:600 11px/1.2 var(--cap);letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.edge .l{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.edge i{width:4px;height:4px;background:var(--line-2);transform:rotate(45deg)}

/* ---------- type & blocks ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:0 0 22px;flex-wrap:wrap}
h1{font:700 30px/1.15 var(--ui);letter-spacing:-.02em;margin:0}
.ph p{margin:6px 0 0;color:var(--muted)}
h2{font:650 17px/1.3 var(--ui);margin:0}
h3{font:650 15px/1.3 var(--ui);margin:0}
.mod{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mod-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line)}
.mod-b{padding:16px 18px}
.grid{display:grid;gap:18px}
.g-2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g-2e{grid-template-columns:1fr 1fr}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--paper);font-weight:600;font-size:14px;cursor:pointer;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.btn.pri:hover{background:var(--indigo-2)}
.btn.ok{background:var(--leaf);border-color:var(--leaf);color:#fff}
.btn.ok:hover{background:var(--leaf-ink)}
.btn.warn{color:var(--fault);border-color:#E3B8B1}
.btn.warn:hover{background:var(--fault-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.sm{min-height:32px;padding:0 12px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:999px;border:0;background:transparent;cursor:pointer;color:inherit}
.icon-btn:hover{background:var(--sunk)}
label.f{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
.field{margin-bottom:14px}
.inp,select.inp,textarea.inp{width:100%;min-height:42px;padding:9px 12px;border:1px solid var(--line-2);border-radius:var(--r-s);background:#fff}
textarea.inp{min-height:84px;resize:vertical}
.inp:focus{outline:2px solid var(--indigo-3);outline-offset:0;border-color:transparent}
.hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.split{display:flex;justify-content:space-between;align-items:center;gap:12px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--sunk);color:var(--muted)}
.pill.o{background:var(--ochre-soft);color:var(--ochre-ink)}
.pill.i{background:var(--indigo-soft);color:var(--indigo-text)}
.pill.g{background:var(--leaf-soft);color:var(--leaf-ink)}
.pill.r{background:var(--fault-soft);color:var(--fault)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--ochre);color:#2A1B00;font:700 11px/20px var(--ui);text-align:center}
.seg{display:inline-flex;gap:4px;padding:4px;background:var(--sunk);border-radius:999px;flex-wrap:wrap}
.seg a,.seg button{border:0;background:transparent;padding:7px 14px;border-radius:999px;font-weight:600;font-size:13px;color:var(--muted);text-decoration:none;cursor:pointer}
.seg [aria-current=true]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--line-2);cursor:pointer;flex:none;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.switch[aria-checked=true]{background:var(--leaf)}
.switch[aria-checked=true]::after{transform:translateX(18px)}
.switch[disabled]{opacity:.55;cursor:not-allowed}
.search{position:relative;flex:1;min-width:200px;max-width:360px}
.search svg{position:absolute;left:12px;top:11px;color:var(--muted)}
.search .inp{padding-left:40px;border-radius:999px}
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.av{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-text);font:700 13px/1 var(--ui);flex:none}
.av.sm{width:30px;height:30px;font-size:11px}
.proto{border:1px dashed var(--line-2);border-radius:var(--r-s);padding:8px 12px;font-size:12.5px;color:var(--muted);background:transparent}
.proto b{font:600 11px/1 var(--cap);letter-spacing:.12em;text-transform:uppercase;margin-right:6px}

/* ---------- lists ---------- */
.list{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:grid;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer;text-align:left;width:100%;background:transparent;border-left:0;border-right:0;border-bottom:0}
.li:first-child{border-top:0}
.li:hover{background:#FBF6EC}
.li.head{cursor:default;background:var(--sunk);font:600 11px/1.2 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:10px;padding-bottom:10px}
.li.head:hover{background:var(--sunk)}
.li.lit{background:#FDF3DC;box-shadow:inset 0 0 0 1px var(--ochre)}
.li small{display:block;color:var(--muted);font-size:13px}
.o-row{grid-template-columns:64px minmax(140px,1.2fr) minmax(160px,2fr) 110px 130px 150px 168px}
.p-row{grid-template-columns:minmax(200px,2.2fr) 110px 100px 150px 90px}
.c-row{grid-template-columns:minmax(180px,2fr) 80px 120px 130px 110px}
.right{text-align:right}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}

/* ---------- today ---------- */
.need{display:grid;grid-template-columns:36px 1fr auto;gap:14px;align-items:center;padding:13px 18px;border-top:1px solid var(--line)}
.need:first-child{border-top:0}
.need small{display:block;color:var(--muted);font-size:13.5px;margin-top:2px}
.need .ico{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--ochre-soft);color:var(--ochre-ink)}
.need .ico.r{background:var(--fault-soft);color:var(--fault)}
.need .ico.i{background:var(--indigo-soft);color:var(--indigo-text)}
.daybook{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:18px}
.daybook div{padding:14px 18px;border-left:1px solid var(--line)}
.daybook div:first-child{border-left:0}
.daybook dt{font:600 11px/1.2 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.daybook dd{margin:6px 0 0;font:650 21px/1.2 var(--ui);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.daybook small{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.up{color:var(--leaf-ink)}
.pipe{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line)}
.pipe a{padding:14px 16px;border-left:1px solid var(--line);text-decoration:none;color:var(--ink)}
.pipe a:first-child{border-left:0}
.pipe a:hover{background:#FBF6EC}
.pipe b{display:block;font:650 24px/1 var(--ui);font-variant-numeric:tabular-nums}
.pipe span{font-size:13px;color:var(--muted)}
.chart text{font:11px var(--ui);fill:var(--muted)}
.bars-h{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;font-size:14px}
.bar-track{grid-column:1/-1;height:6px;border-radius:6px;background:var(--sunk);margin-bottom:8px}
.bar-track i{display:block;height:100%;border-radius:6px;background:var(--indigo-3)}

/* ---------- chats ---------- */
.chats{display:grid;grid-template-columns:330px minmax(0,1fr) 330px;height:100%;min-height:0}
.chats > *{min-width:0}
.c-list{border-right:1px solid var(--line);background:var(--paper);display:flex;flex-direction:column;min-height:0}
.c-list .top{padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.c-list .items{overflow-y:auto;flex:1}
.ci{display:grid;grid-template-columns:38px 1fr auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.ci:hover{background:#FBF6EC}
.ci[aria-current=true]{background:var(--indigo-soft)}
.ci .t{font-weight:650;display:flex;gap:8px;align-items:center}
.ci .p{font-size:13.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci .r{display:flex;flex-direction:column;align-items:flex-end;gap:6px;font-size:12px;color:var(--muted)}
.thread{display:flex;flex-direction:column;min-height:0;background:var(--chat-ground)}
.th-h{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.th-h .who{flex:1;min-width:0}
.th-h .who small{display:block;color:var(--muted);font-size:12.5px}
.msgs{flex:1;overflow-y:auto;padding:18px 6% 10px;display:flex;flex-direction:column;gap:6px}
.day{align-self:center;margin:8px 0;padding:4px 12px;border-radius:999px;background:var(--paper);font:600 11px/1.4 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.msg{display:flex}
.msg.out{justify-content:flex-end}
.bubble{max-width:min(520px,78%);padding:7px 10px 6px;border-radius:10px;background:var(--paper);box-shadow:0 1px 1px rgba(45,32,8,.08);position:relative}
.msg.in .bubble{border-top-left-radius:2px}
.msg.out .bubble{background:var(--bubble-out);border-top-right-radius:2px}
.bubble p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.bubble .by{display:block;font:600 11px/1.3 var(--cap);letter-spacing:.1em;text-transform:uppercase;color:var(--leaf-ink);margin-bottom:2px}
.bubble .meta{display:flex;justify-content:flex-end;align-items:center;gap:3px;font-size:11px;color:var(--muted);margin-top:2px}
.bubble .meta svg{width:15px;height:15px;color:#3B7BBF}
.wa-btn{margin:8px -10px -2px;padding:9px;border-top:1px solid rgba(0,0,0,.08);display:flex;justify-content:center;gap:8px;color:#1F7A9C;font-weight:600;font-size:14px}
.wa-btns{display:flex;flex-direction:column;gap:0;margin:8px -10px -2px}
.wa-btns span{padding:9px;border-top:1px solid rgba(0,0,0,.08);text-align:center;color:#1F7A9C;font-weight:600;font-size:14px}
.draft{align-self:center;width:min(560px,100%);margin:10px 0;background:var(--paper);border:1px solid var(--ochre);border-radius:var(--r);box-shadow:var(--lift)}
.draft .edge{color:var(--ochre-ink);border-bottom-color:var(--ochre-soft);background:#FDF5E2;border-radius:var(--r) var(--r) 0 0}
.draft .body{padding:14px 16px}
.draft blockquote{margin:0 0 12px;padding:8px 12px;background:var(--sunk);border-radius:var(--r-s);font-style:italic}
.dl{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:center;margin-bottom:10px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-2);border-radius:999px}
.qty button{width:30px;height:30px;border:0;background:transparent;cursor:pointer;font-size:16px;font-weight:700;border-radius:999px}
.qty button:hover{background:var(--sunk)}
.qty span{min-width:22px;text-align:center;font-weight:650}
.composer{background:var(--paper);border-top:1px solid var(--line);padding:10px 14px 12px}
.quick{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.quick button{flex:none;border:1px solid var(--line-2);background:transparent;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.quick button:hover{background:var(--sunk)}
.compose-row{display:flex;gap:10px;align-items:flex-end}
.compose-row textarea{flex:1;min-height:44px;max-height:120px;border-radius:22px;padding:11px 16px;resize:none}
.send{width:44px;height:44px;border-radius:50%;border:0;background:var(--leaf);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.send:hover{background:var(--leaf-ink)}
.window{font-size:12px;color:var(--muted);margin-top:6px}
.ctx{border-left:1px solid var(--line);background:var(--paper);overflow-y:auto;padding:18px}
.ctx section{margin-bottom:20px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin:10px 0 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.no-chat{display:grid;place-items:center;height:100%;color:var(--muted);text-align:center;padding:30px}
.ctx-btn{display:none}

/* ---------- order record ---------- */
.rec{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rec .body{padding:14px 16px}
.items-t{width:100%;border-collapse:collapse;font-size:14px}
.items-t td{padding:5px 0;vertical-align:top}
.items-t td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.items-t tr.tot td{border-top:1px solid var(--line);padding-top:9px;font-weight:700}
.steps{list-style:none;margin:12px 0;padding:0;display:flex;gap:4px}
.steps li{flex:1;height:6px;border-radius:6px;background:var(--sunk)}
.steps li.done{background:var(--leaf)}
.steps li.now{background:var(--ochre)}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:start;padding:6px 0;font-size:14px}
.timeline li::before{content:"";width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--leaf)}
.timeline li span{color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- payments ---------- */
.pay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.amts{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r-s);margin:12px 0}
.amts div{padding:10px 12px}
.amts div+div{border-left:1px solid var(--line)}
.amts dt{font:600 11px/1.2 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.amts dd{margin:4px 0 0;font:650 19px/1.2 var(--ui);font-variant-numeric:tabular-nums}
.amts .bad dd{color:var(--fault)}
.ref{font:600 15px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;letter-spacing:.06em}
.flag{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:var(--r-s);background:var(--fault-soft);color:#7A1C15;font-size:13.5px;margin-bottom:8px}
.flag.o{background:var(--ochre-soft);color:var(--ochre-ink)}
.flag svg{width:18px;height:18px;margin-top:1px}

/* ---------- kitchen ---------- */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
.kcol h2{display:flex;gap:10px;align-items:center;margin-bottom:12px}
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ticket .edge{font-size:12px}
.ticket ul{list-style:none;margin:0;padding:12px 16px;font-size:19px;font-weight:650;line-height:1.5}
.ticket ul b{display:inline-block;min-width:34px;color:var(--indigo-text)}
.ticket .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px 14px}
.timer{font:700 20px/1 var(--ui);font-variant-numeric:tabular-nums}
.timer.late{color:var(--ochre-ink)}
.timer.very{color:var(--fault)}

/* ---------- settings ---------- */
.set{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px;align-items:start}
.set-nav{display:flex;flex-direction:column;gap:2px;position:sticky;top:0}
.set-nav a{padding:9px 12px;border-radius:var(--r-s);text-decoration:none;color:var(--muted);font-weight:600}
.set-nav a:hover{background:var(--sunk)}
.set-nav a[aria-current=page]{background:var(--paper);color:var(--ink);box-shadow:var(--lift)}
.set-row{display:flex;justify-content:space-between;gap:20px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.set-row:first-child{border-top:0}
.set-row p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.plans{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.plan{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.plan.cur{border-color:var(--indigo-3);box-shadow:inset 0 0 0 1px var(--indigo-3)}
.plan .price{font:700 26px/1 var(--ui);font-variant-numeric:tabular-nums}
.plan .price small{font-size:13px;font-weight:500;color:var(--muted)}
.plan ul{margin:0;padding:0;list-style:none;font-size:13.5px;display:grid;gap:6px}
.plan li{display:flex;gap:8px}
.plan li svg{width:16px;height:16px;color:var(--leaf);margin-top:2px}
.plan .btn{margin-top:auto}
.measure{width:100%;height:auto;display:block}
.perm{width:100%;border-collapse:collapse;font-size:14px}
.perm th,.perm td{padding:9px 10px;border-top:1px solid var(--line);text-align:center}
.perm th:first-child,.perm td:first-child{text-align:left}
.perm thead th{border-top:0;font:600 11px/1.2 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.perm svg{width:18px;height:18px;color:var(--leaf)}

/* ---------- drawer / toast ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,30,.38);z-index:40;animation:fade .2s ease-out}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--cotton);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 40px -10px rgba(20,18,30,.35);animation:slide .32s cubic-bezier(.16,1,.3,1)}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;background:var(--paper);border-bottom:1px solid var(--line)}
.drawer .db{flex:1;overflow-y:auto;padding:18px}
.drawer .df{padding:12px 18px;background:var(--paper);border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
@keyframes slide{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
.toasts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:var(--indigo);color:var(--on-indigo);padding:11px 18px;border-radius:999px;box-shadow:var(--lift);font-weight:500;font-size:14px;animation:rise .35s cubic-bezier(.16,1,.3,1);display:flex;gap:10px;align-items:center}
.toast.bad{background:var(--fault)}
@keyframes rise{from{transform:translateY(12px);opacity:0}}
@keyframes glow{0%{box-shadow:inset 0 0 0 1px var(--ochre),0 0 0 6px rgba(196,134,15,.25)}100%{box-shadow:inset 0 0 0 1px var(--ochre),0 0 0 0 rgba(196,134,15,0)}}
.li.lit.fresh{animation:glow 1.4s cubic-bezier(.16,1,.3,1)}

/* ---------- onboarding ---------- */
.ob{min-height:100dvh;display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 28px;background:var(--indigo);color:var(--on-indigo)}
.ob-top a{color:var(--on-indigo-muted);font-size:14px}
.ob-body{flex:1;display:grid;grid-template-columns:minmax(0,560px) minmax(0,420px);gap:48px;justify-content:center;padding:40px 28px 60px}
.ob h1{font-size:34px;margin-bottom:8px}
.ob .lead{color:var(--muted);margin:0 0 26px;font-size:16px;max-width:52ch}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line-2);background:var(--paper);border-radius:999px;padding:8px 16px;font-weight:600;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--indigo);border-color:var(--indigo);color:var(--on-indigo)}
.ob-actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px;align-items:center}
.ob-aside{align-self:start;position:sticky;top:30px}
.phone{background:var(--chat-ground);border:8px solid var(--ink);border-radius:34px;overflow:hidden;max-width:340px;box-shadow:var(--lift)}
.phone .ph-h{background:#1F5C4A;color:#fff;padding:14px 16px;display:flex;gap:10px;align-items:center;font-weight:600}
.phone .ph-h small{display:block;font-weight:400;opacity:.8;font-size:12px}
.phone .ph-b{padding:14px 12px 20px;display:flex;flex-direction:column;gap:6px;min-height:380px}
.wa-list{background:var(--paper);border-radius:10px;margin-top:6px;overflow:hidden}
.wa-list div{padding:10px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;font-size:14px}
.wa-list div:first-child{border-top:0;font:600 11px/1.3 var(--cap);letter-spacing:.12em;text-transform:uppercase;color:var(--leaf-ink)}
.steps-ob{list-style:none;margin:0 0 22px;padding:0;display:grid;gap:10px}
.steps-ob li{display:flex;gap:12px;align-items:flex-start}
.steps-ob li span{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--indigo-soft);color:var(--indigo-text);font-weight:700;font-size:13px;flex:none}
.meta-pop{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:rgba(20,18,30,.45);padding:20px;animation:fade .2s}
.meta-card{background:#fff;border-radius:14px;width:min(420px,100%);box-shadow:0 20px 60px -20px rgba(0,0,0,.5);overflow:hidden}
.meta-card .mh{padding:14px 18px;border-bottom:1px solid #E4E6EB;display:flex;justify-content:space-between;align-items:center;font-weight:650;color:#1C1E21}
.meta-card .mb{padding:20px 18px;color:#1C1E21}
.meta-opt{display:flex;gap:12px;align-items:center;width:100%;padding:12px;border:1px solid #CED0D4;border-radius:10px;background:#fff;margin-bottom:10px;cursor:pointer;text-align:left}
.meta-opt:hover{background:#F2F3F5}
.meta-btn{width:100%;min-height:42px;border:0;border-radius:8px;background:#1877F2;color:#fff;font-weight:650;cursor:pointer}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid #E4E6EB;border-top-color:#1877F2;animation:sp 0.8s linear infinite;margin:10px auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.ok-chip{display:inline-flex;gap:8px;align-items:center;padding:10px 14px;border-radius:var(--r-s);background:var(--leaf-soft);color:var(--leaf-ink);font-weight:600}

/* ---------- responsive ---------- */
@media (max-width:1240px){
  .chats{grid-template-columns:300px minmax(0,1fr)}
  .chats .ctx{display:none}
  .ctx-btn{display:inline-flex}
  .o-row{grid-template-columns:56px minmax(130px,1.2fr) minmax(140px,1.6fr) 100px 130px 150px}
  .o-row .act{display:none}
  .plans{grid-template-columns:1fr 1fr}
}
@media (max-width:900px){

  .mtop small{color:var(--on-indigo-muted);font-size:12.5px}
  .selv{padding:8px 14px}
  .view{padding:18px 14px 28px}

  .tabs-m a,.tabs-m button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;font-size:11.5px;font-weight:600;color:var(--muted);text-decoration:none;border:0;background:transparent;position:relative;cursor:pointer}
  .tabs-m [aria-current=page]{color:var(--indigo)}
  .tabs-m [aria-current=page] svg{stroke-width:2.2}
  .tabs-m .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;line-height:18px;font-size:10px}
  .g-2,.g-2e{grid-template-columns:1fr}
  .daybook{grid-template-columns:1fr 1fr}
  .daybook div{border-left:0;border-top:1px solid var(--line)}
  .daybook div:nth-child(-n+2){border-top:0}
  .daybook div:nth-child(even){border-left:1px solid var(--line)}
  .daybook div:last-child{grid-column:1/-1;border-left:0}
  .pipe{grid-template-columns:repeat(5,minmax(64px,1fr));overflow-x:auto}
  .pipe a{padding:12px 10px}
  .chats{grid-template-columns:minmax(0,1fr)}
  .chats.has .c-list{display:none}
  .chats:not(.has) .thread{display:none}
  .back-btn{display:inline-grid}
  .msgs{padding:14px 10px 8px}
  .bubble{max-width:86%}
  .kds{grid-template-columns:1fr}
  .set{grid-template-columns:1fr;gap:14px}
  .set-nav{flex-direction:row;overflow-x:auto;position:static;scrollbar-width:none}
  .set-nav a{white-space:nowrap}
  .seg{flex-wrap:nowrap;overflow-x:auto;max-width:100%;scrollbar-width:none}
  .seg > *{flex:none}
  .toolbar .search{max-width:none}
  .ob-body{grid-template-columns:1fr;padding:24px 16px 40px;gap:30px}
  .ob-top{padding:12px 16px}
  .ob h1{font-size:27px}
  .ob-aside{position:static}
  .toasts{bottom:84px}
}
@media (min-width:901px){.back-btn{display:none}}
@media (max-width:680px){

  .o-row{grid-template-columns:1fr auto;gap:4px 12px}
  .o-row > :nth-child(1){grid-column:1;font-weight:700}
  .o-row > :nth-child(2){grid-column:1}
  .o-row > :nth-child(3){grid-column:1/-1;font-size:14px;color:var(--muted)}
  .o-row > :nth-child(4){grid-column:2;grid-row:1;text-align:right}
  .o-row > :nth-child(5){grid-column:1}
  .o-row > :nth-child(6){grid-column:2;grid-row:2;text-align:right}
  .p-row{grid-template-columns:1fr auto;gap:4px 12px}
  .p-row > :nth-child(2){display:none}
  .p-row > :nth-child(3){grid-column:2;grid-row:1;text-align:right}
  .p-row > :nth-child(4){grid-column:1}
  .p-row > :nth-child(5){grid-column:2;grid-row:2;justify-self:end}
  .c-row{grid-template-columns:1fr auto;gap:4px 12px}
  .c-row > :nth-child(2),.c-row > :nth-child(4){display:none}
  .c-row > :nth-child(3){grid-column:2;grid-row:1;text-align:right}
  .c-row > :nth-child(5){grid-column:2;justify-self:end}
  .plans{grid-template-columns:1fr}
  .pay-grid{grid-template-columns:1fr}
  .need{grid-template-columns:36px 1fr}
  .need .btn{grid-column:2;justify-self:start}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

function salesChart(today) {
  const data = [...SALES, today];
  const max = 300000, W = 700, H = 210, pl = 54, pb = 26, bw = (W - pl) / data.length;
  const days = data.map((_, i) => { const d = new Date(startOfDay - (data.length - 1 - i) * 86400000); return d.toLocaleDateString('en-GB', {weekday: 'short'}).slice(0, 2); });
  let g = '';
  for (const v of [0, 100000, 200000, 300000]) { const y = H - pb - (v / max) * (H - pb - 10); g += `<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#E0D5C1"/><text x="${pl - 8}" y="${y + 4}" text-anchor="end">${v ? (v / 100000) + 'k' : '0'}</text>`; }
  const bars = data.map((v, i) => { const h = (v / max) * (H - pb - 10); const x = pl + i * bw + bw * .18; const last = i === data.length - 1;
    return `<rect x="${x.toFixed(1)}" y="${(H - pb - h).toFixed(1)}" width="${(bw * .64).toFixed(1)}" height="${h.toFixed(1)}" rx="3" fill="${last ? '#C4860F' : '#8B95C6'}"><title>${days[i]}: ${cedi(v)}</title></rect><text x="${(x + bw * .32).toFixed(1)}" y="${H - 8}" text-anchor="middle" ${last ? 'style="font-weight:700;fill:#6B4500"' : ''}>${last ? 'Today' : days[i]}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Daily sales in cedis for the last 14 days. Today ${cedi(today)}."><text x="${pl - 8}" y="10" text-anchor="end">GH₵</text>${g}${bars}</svg>`;
}

      <div class="quick">${['Your order is on the way', 'Please send the MoMo Transaction ID', "We're closed now. We open at 8am", 'Thank you! Come again'].map(q => `<button data-a="quick" data-t="${esc(q)}">${esc(q)}</button>`).join('')}</div>

}
function ctxPanel(cu, order) {
  const st = custStats(cu);

    <dl class="kv"><dt>Orders</dt><dd>${st.orders}</dd><dt>Spent</dt><dd>${cedi(st.spent)}</dd><dt>Area</dt><dd>${esc(cu.area)}</dd></dl>

    ${order ? `<section><h3 style="margin-bottom:10px">Latest order</h3>${orderRecord(order, true)}</section>` : '<p class="muted">No orders yet.</p>'}`;
}
function msgHtml(m, ch) {
  if (m.type === 'draft') return draftCard(m, ch);
  if (m.type === 'proto') return `<div class="proto" style="align-self:center;margin:8px 0"><b>Prototype</b>${m.body} <button class="btn sm" data-a="simPay" data-cid="${ch.cid}" ${m.done ? 'disabled' : ''}>${m.done ? 'Sent' : 'Simulate'}</button></div>`;
  const side = m.dir === 'in' ? 'in' : 'out';
  let inner = `<p>${esc(m.body)}</p>`;
  if (m.type === 'list') inner += `<div class="wa-btn">${ic('list', 'style="width:18px;height:18px"')}View menu</div>`;
  if (m.type === 'buttons') inner += `<div class="wa-btns">${m.buttons.map(b => `<span>${esc(b)}</span>`).join('')}</div>`;
  const by = m.dir === 'out' ? (m.by === 'bot' ? 'Kasa bot' : 'You') : (m.tap ? 'Tapped' : '');
  return `<div class="msg ${side}"><div class="bubble">${by ? `<span class="by">${by}</span>` : ''}${inner}<span class="meta num">${hm(m.at)}${m.dir === 'out' ? ic('ticks') : ''}</span></div></div>`;
}
function draftCard(m, ch) {
  const cu = C(ch.cid);
  const lines = m.items.map((i, k) => { const p = P(i.pid);
    return `<span>${esc(p.name)}<small class="muted" style="display:block;font-size:12.5px">${cedi(p.price)} each · ${p.stock} in stock</small></span>
    ${m.done ? `<span class="num">${i.qty}×</span>` : `<span class="qty"><button data-a="dq" data-cid="${ch.cid}" data-k="${k}" data-d="-1" aria-label="Fewer ${esc(p.name)}">−</button><span class="num">${i.qty}</span><button data-a="dq" data-cid="${ch.cid}" data-k="${k}" data-d="1" aria-label="More ${esc(p.name)}">+</button></span>`}
    <span class="num right">${cedi(p.price * i.qty)}</span>`; }).join('');
  const s = m.items.reduce((a, i) => a + P(i.pid).price * i.qty, 0) + (m.fulfil === 'delivery' ? S.org.fee : 0);
  return `<div class="draft" role="group" aria-label="Order Kasa read from the message">
    <div class="edge"><span class="l">${ic('spark', 'style="width:14px;height:14px"')}<span>Kasa read this as an order</span><i></i><span>Only you can see this</span></span><span class="num">${hm(m.at)}</span></div>
    <div class="body"><blockquote>“${esc(m.said)}”</blockquote>
      <div class="dl">${lines}<span>${m.fulfil === 'delivery' ? 'Delivery to ' + esc(m.addr) : 'Pickup'}</span><span></span><span class="num right">${m.fulfil === 'delivery' ? cedi(S.org.fee) : '—'}</span>
      <b>Total</b><span></span><b class="num right">${cedi(s)}</b></div>
      ${m.done ? `<div class="ok-chip">${ic('check')}Order #${m.done} created. MoMo details sent to ${esc(cu.name.split(' ')[0])}.</div>`
      : `<p class="hint" style="margin:0 0 12px">Matched all ${m.items.length} items · ${m.sure}% sure. Change the quantities if Kasa got it wrong.</p>
      <div class="row"><button class="btn ok" data-a="draftOk" data-cid="${ch.cid}">${ic('check')}Create order &amp; send MoMo details</button><button class="btn ghost" data-a="draftNo" data-cid="${ch.cid}">Not an order</button></div>`}
    </div></div>`;
}

/* orders */
function orderRecord(o, compact = false) {
  const cu = C(o.cid);
  const nx = nextOf(o);
  const idx = o.status === 'cancelled' ? -1 : FLOW.indexOf(o.status);
  const flow = o.fulfil === 'pickup' ? FLOW.filter(s => s !== 'out') : FLOW;
  const stepIdx = flow.indexOf(o.status);
  return `<div class="rec">
    <div class="edge"><span class="l"><span>Order #${o.no}</span><i></i><span class="num">${hm(o.placed)}</span><i></i><span>${o.fulfil === 'pickup' ? 'Pickup' : 'Delivery'}</span></span>${statusPill(o)}</div>
    <div class="body">
      ${compact ? '' : `<div class="split" style="margin-bottom:10px"><div><b>${esc(cu.name)}</b><div class="muted num" style="font-size:13px">${fmtPhone(cu.phone)}</div></div><a class="btn sm" href="#/chats/${cu.id}">${ic('chat', 'style="width:16px;height:16px"')}Chat</a></div>`}
      <table class="items-t">${o.items.map(i => `<tr><td>${i.qty}× ${esc(P(i.pid).name)}</td><td>${cedi(i.price * i.qty)}</td></tr>`).join('')}
        ${o.fee ? `<tr><td class="muted">Delivery</td><td>${cedi(o.fee)}</td></tr>` : ''}<tr class="tot"><td>Total</td><td>${cedi(total(o))}</td></tr></table>
      ${o.status !== 'cancelled' ? `<ol class="steps" aria-label="Progress: ${LABEL[o.status]}">${flow.map((s, k) => `<li class="${k < stepIdx || o.status === 'delivered' ? 'done' : k === stepIdx ? 'now' : ''}" title="${LABEL[s]}"></li>`).join('')}</ol>` : ''}
      ${o.addr ? `<p style="margin:6px 0;font-size:14px">${ic('truck', 'style="width:16px;height:16px;vertical-align:-3px"')} ${esc(o.addr)}${o.rider ? ` · ${esc(o.rider.name)} (${esc(o.rider.phone)})` : ''}</p>` : ''}
      <p class="muted" style="margin:6px 0 12px;font-size:13px">Payment: ${({awaiting: 'not paid yet', submitted: 'MoMo sent, waiting for your check', paid: 'paid by MoMo', rejected: 'rejected'})[o.pay]}</p>
      ${o.status === 'pending' && o.pay === 'submitted' ? `<a class="btn pri" href="#/payments">${ic('wallet')}Check MoMo first</a>` : ''}
      ${o.status === 'pending' && o.pay === 'awaiting' ? `<p class="hint">Kasa confirms the order once you've checked the MoMo payment.</p>` : ''}
      ${nx ? `<div class="row">${nx === 'out' ? riderSelect(o) : ''}<button class="btn ok" data-a="adv" data-id="${o.id}" data-to="${nx}">${actionLabel(o, nx)}</button></div>` : ''}
    </div></div>`;
}
const riderSelect = o => `<label class="sr" for="rider-${o.id}">Rider</label><select id="rider-${o.id}" class="inp" style="width:auto;min-height:40px">${S.riders.map(r => `<option>${r.name}</option>`).join('')}</select>`;
function vOrders() {
  const tab = S.ui.orderTab;

  const counts = Object.fromEntries(Object.keys(F).map(k => [k, S.orders.filter(F[k]).length]));
  const rows = S.orders.filter(F[tab]);
  const T = [['active', 'In progress'], ['pay', 'Awaiting payment'], ['done', 'Delivered'], ['cancelled', 'Cancelled'], ['all', 'All']];
  return `<div class="view"><div class="ph"><div><h1>Orders</h1><p>Every order from WhatsApp, newest first. Tap one to move it along.</p></div></div>
  <div class="toolbar"><div class="seg" role="tablist">${T.map(([k, l]) => `<button role="tab" data-a="otab" data-t="${k}" aria-current="${tab === k}">${l} <span class="num muted">${counts[k]}</span></button>`).join('')}</div>
    <div class="search"><label class="sr" for="oq">Search orders</label>${ic('search')}<input id="oq" class="inp" placeholder="Order number or name" data-filter="o-row"></div></div>
  <div class="list" role="list"><div class="li o-row head" aria-hidden="true"><span>Order</span><span>Customer</span><span>Items</span><span class="right">Total</span><span>Payment</span><span>Status</span><span></span></div>
  ${rows.length ? rows.map(o => { const cu = C(o.cid); const nx = nextOf(o);
    return `<div class="li o-row ${o.lit ? 'lit' : ''}" role="listitem" data-search="${o.no} ${esc(cu.name)}" data-a="open" data-kind="order" data-id="${o.id}" tabindex="0">
      <span class="num">#${o.no}<small>${hm(o.placed)}</small></span><span>${esc(cu.name)}<small>${o.fulfil === 'pickup' ? 'Pickup' : esc(o.addr.split(',')[0])}</small></span>
      <span>${esc(itemsText(o))}</span><span class="num right">${cedi(total(o))}</span><span>${payPill(o)}</span><span>${statusPill(o)}${o.lit ? ' <span class="pill o">Updated</span>' : ''}</span>
      <span class="act right">${nx && nx !== 'out' ? `<button class="btn sm ok" data-a="adv" data-id="${o.id}" data-to="${nx}">${actionLabel(o, nx)}</button>` : nx === 'out' ? `<button class="btn sm" data-a="open" data-kind="order" data-id="${o.id}">Assign rider</button>` : o.status === 'pending' && o.pay === 'submitted' ? '<a class="btn sm" href="#/payments">Check MoMo</a>' : ''}</span></div>`; }).join('')
  : `<div class="empty">No orders here right now.</div>`}</div></div>`;

/* payments */
function flags(p) {
  const o = O(p.oid); const f = [];
  if (p.claimed !== total(o)) f.push(['r', `Amount doesn't match. Order is ${cedi(total(o))}, customer says ${cedi(p.claimed)}.`]);
  const dup = S.payments.find(q => q !== p && q.ref === p.ref && q.status !== 'rejected');
  if (dup) f.push(['r', `This Transaction ID was already used for order #${O(dup.oid).no}. It may be an old receipt.`]);
  return f;
}
function vPayments() {
  const tab = S.ui.payTab;
  const list = S.payments.filter(p => tab === 'check' ? p.status === 'submitted' : p.status === tab).sort((a, b) => b.at - a.at);
  const T = [['check', 'To check', toCheck().length], ['verified', 'Verified', S.payments.filter(p => p.status === 'verified').length], ['rejected', 'Rejected', S.payments.filter(p => p.status === 'rejected').length]];
  return `<div class="view"><div class="ph"><div><h1>MoMo checks</h1><p>Match each Transaction ID and amount with the MoMo SMS on your phone before you confirm.</p></div></div>
  <div class="toolbar"><div class="seg">${T.map(([k, l, n]) => `<button data-a="ptab" data-t="${k}" aria-current="${tab === k}">${l} <span class="num muted">${n}</span></button>`).join('')}</div></div>
  <div class="grid g-2" style="align-items:start"><div class="pay-grid">${list.length ? list.map(payCard).join('') : `<div class="mod empty">${tab === 'check' ? 'No payments waiting. Nice.' : 'Nothing here yet.'}</div>`}</div>
  <aside class="mod"><div class="mod-h"><h2>Your MoMo numbers</h2><a href="#/settings/payments">Edit</a></div><div class="mod-b">
    <dl class="kv" style="margin:0"><dt>MTN MoMo</dt><dd class="num">${S.org.momo.mtn || '—'}</dd><dt>Telecel Cash</dt><dd class="num">${S.org.momo.telecel || '—'}</dd><dt>AirtelTigo Money</dt><dd class="num">${S.org.momo.at || 'Not set'}</dd></dl>
    <h3 style="margin:20px 0 8px">How to check a payment</h3>
    <ol style="margin:0;padding-left:18px;font-size:14px;display:grid;gap:6px"><li>Open the MoMo SMS on the phone that received it.</li><li>Find the same Transaction ID.</li><li>Make sure the amount matches the order.</li><li>Tap Verify. Kasa confirms the order and thanks the customer.</li></ol>
    <p class="proto" style="margin-top:16px"><b>Later</b>Automatic checks with MTN MoMo, Telecel Cash and AirtelTigo Money will plug in here.</p></div></aside></div></div>`;
}
function payCard(p) {
  const o = O(p.oid); const cu = C(o.cid); const f = flags(p); const bad = p.claimed !== total(o);
  return `<article class="rec"><div class="edge"><span class="l"><span>${p.net}</span><i></i><span class="num">${hm(p.at)}</span><i></i><span>Order #${o.no}</span></span>${p.status === 'verified' ? '<span class="pill g">Verified</span>' : p.status === 'rejected' ? '<span class="pill r">Rejected</span>' : f.length ? '<span class="pill r">Check carefully</span>' : '<span class="pill o">To check</span>'}</div>
    <div class="body"><div class="split"><div><b>${esc(cu.name)}</b><div class="muted num" style="font-size:13px">Paid from ${fmtPhone(p.payer)}</div></div><a class="btn sm ghost" href="#/chats/${cu.id}">${ic('chat', 'style="width:16px;height:16px"')}Chat</a></div>
      <dl class="amts"><div><dt>Order total</dt><dd>${cedi(total(o))}</dd></div><div class="${bad ? 'bad' : ''}"><dt>Customer says</dt><dd>${cedi(p.claimed)}</dd></div></dl>
      <div style="margin-bottom:12px"><span class="muted" style="font-size:13px">Transaction ID</span><div class="ref num">${p.ref}</div></div>
      ${p.status === 'submitted' ? f.map(([c, t]) => `<div class="flag ${c === 'o' ? 'o' : ''}">${ic('alert')}<span>${t}</span></div>`).join('') : ''}
      ${p.status === 'submitted' ? (S.ui.rejectFor === p.id ? `<div class="field" style="margin-top:8px"><label class="f" for="rr">Why are you rejecting it?</label><select id="rr" class="inp"><option>Amount doesn't match</option><option>Transaction ID not in my MoMo SMS</option><option>Transaction ID already used</option><option>Other</option></select><p class="hint">Kasa tells ${esc(cu.name.split(' ')[0])} and asks her to pay again.</p></div>
        <div class="row"><button class="btn warn" data-a="payNo" data-id="${p.id}">Reject payment</button><button class="btn ghost" data-a="payNoCancel">Keep it</button></div>`
        : `<div class="row" style="margin-top:4px"><button class="btn ok" data-a="payOk" data-id="${p.id}">${ic('check')}Verify &amp; confirm order</button><button class="btn warn" data-a="payNoAsk" data-id="${p.id}">Reject</button></div>`)
      : `<p class="muted" style="font-size:13px;margin:0">${p.status === 'verified' ? 'Verified' : 'Rejected'} by ${p.by} at ${hm(p.at + 120000)}${p.why ? ' · ' + esc(p.why) : ''}</p>`}
    </div></article>`;
}

function measure(used, limit) {
  if (!limit) return `<p class="muted">Unlimited orders. ${used} used this month.</p>`;
  const W = 760, step = W / limit; let ticks = '';
  for (let k = 0; k <= limit; k++) { const x = 10 + k * step * (W - 20) / W; const big = k % 5 === 0; ticks += `<line x1="${x.toFixed(1)}" x2="${x.toFixed(1)}" y1="${big ? 30 : 38}" y2="56" stroke="${k <= used ? '#26346F' : '#CDBFA6'}" stroke-width="${big ? 1.6 : 1}"/>${big && k % (limit > 30 ? 15 : 5) === 0 ? `<text x="${x.toFixed(1)}" y="72" text-anchor="middle">${k}</text>` : ''}`; }
  const ux = 10 + used * step * (W - 20) / W;
  return `<svg class="measure chart" viewBox="0 0 ${W} 80" role="img" aria-label="${used} of ${limit} orders used this month"><line x1="10" x2="${W - 10}" y1="56" y2="56" stroke="#CDBFA6"/><line x1="10" x2="${ux.toFixed(1)}" y1="56" y2="56" stroke="#26346F" stroke-width="3"/>${ticks}<path d="M${ux.toFixed(1)} 26 l-6 -10 h12z" fill="#C4860F"/><text x="${ux.toFixed(1)}" y="11" text-anchor="middle" style="font-weight:700;fill:#6B4500">${used}</text></svg>`;
}

      <div class="mod mod-b" style="margin-bottom:18px"><span class="muted" style="font-size:13px">Your order link</span><div class="ref" style="margin-top:6px;font-size:16px">wa.me/233245550142?text=Menu</div></div>
      <a class="btn pri" href="#/today" data-a="obDone">Go to my dashboard ${ic('arrow')}</a>`;
    aside = obAside(['Your menu bot is live.', 'MoMo checks wait for you in one list.', 'Stock goes down by itself as orders come in.']);
  }
  const nav = step < 5 ? `<div class="ob-actions">${step > 1 ? `<a class="btn ghost" href="#/onboarding/${step - 1}">${ic('back')}Back</a>` : '<span></span>'}
    <div class="row">${step === 2 && !ob.wa ? `<a class="btn ghost" href="#/onboarding/3">I'll do this later</a>` : ''}<a class="btn pri" href="#/onboarding/${step + 1}">Continue ${ic('arrow')}</a></div></div>` : '';
  const meta = ob.meta ? metaPopup() : '';
  return `<div class="ob">${top}<div class="ob-body"><div>${main}${nav}</div><aside class="ob-aside" aria-label="Preview">${aside}</aside></div>${meta}</div>`;
}
const obAside = pts => `<div class="mod"><div class="mod-b"><h3 style="margin-bottom:10px">With Kasa</h3><ul style="margin:0;padding:0;list-style:none;display:grid;gap:10px">${pts.map(p => `<li class="row" style="flex-wrap:nowrap;align-items:flex-start"><span style="color:var(--leaf)">${ic('check')}</span>${p}</li>`).join('')}</ul></div></div>`;
const phonePreview = inner => `<div class="phone" aria-label="WhatsApp preview"><div class="ph-h"><span class="av sm" style="background:#fff;color:#1F5C4A">${initials(S.ob.name || "Ama's Kitchen")}</span><div>${esc(S.ob.name || "Ama's Kitchen")}<small>Business account</small></div></div><div class="ph-b">${inner}</div></div>`;
function metaPopup() {
  const m = S.ob.meta;
  const body = m === 1 ? `<p style="margin-top:0">Choose the business portfolio that owns your WhatsApp number.</p><button class="meta-opt" data-a="meta2"><span class="av sm">AK</span><div><b>${esc(S.ob.name || "Ama's Kitchen")} Ltd</b><div style="font-size:13px;color:#65676B">Business portfolio</div></div></button>`
    : m === 2 ? `<p style="margin-top:0">Choose a WhatsApp Business number.</p><button class="meta-opt" data-a="meta3">${ic('phone')}<div><b class="num">+233 24 555 0142</b><div style="font-size:13px;color:#65676B">Display name: ${esc(S.ob.name || "Ama's Kitchen")}</div></div></button>`
    : `<div class="spin"></div><p style="text-align:center;margin:0">Connecting your number to Kasa…</p>`;
  return `<div class="meta-pop" role="dialog" aria-modal="true" aria-label="Facebook sign-in"><div class="meta-card"><div class="mh"><span>Facebook · Connect WhatsApp</span><button class="icon-btn" data-a="metaX" aria-label="Close">${ic('x')}</button></div><div class="mb">${body}<p style="font-size:12px;color:#65676B;margin:14px 0 0">Prototype: simulated Meta Embedded Signup.</p></div></div></div>`;
}

/* ------------------------------- actions ------------------------------- */
function toast(msg, bad = false) {
  const t = document.createElement('div'); t.className = 'toast' + (bad ? ' bad' : ''); t.innerHTML = (bad ? ic('alert') : ic('check')) + esc(msg);
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}
const firstName = cid => C(cid).name.split(' ')[0];
function say(cid, body) { const ch = chatOf(cid); if (ch) ch.msgs.push({dir: 'out', by: 'bot', type: 'text', body, at: now()}); }
function moveOrder(o, to, extra = {}) {
  if (!NEXT[o.status].includes(to)) { toast(`A ${LABEL[o.status].toLowerCase()} order can't become ${LABEL[to].toLowerCase()}.`, true); return false; }
  o.status = to; o.history.push({s: to, at: now(), ...extra}); o.lit = true;
  const msg = {confirmed: `Your order #${o.no} is confirmed. We're on it!`, preparing: `We're preparing your order #${o.no} now.`, ready: o.fulfil === 'pickup' ? `Your order #${o.no} is ready for pickup at ${S.org.name}, ${S.org.area}.` : `Your order #${o.no} is packed and waiting for the rider.`,
    out: `Your order #${o.no} is on its way with ${o.rider?.name} (${o.rider?.phone}).`, delivered: `Your order #${o.no} has been ${o.fulfil === 'pickup' ? 'collected' : 'delivered'}. Thank you for ordering from ${S.org.name}!`,
    cancelled: `Sorry, your order #${o.no} has been cancelled. ${extra.why || ''}`}[to];
  say(o.cid, msg);
  if (to === 'cancelled') for (const i of o.items) { P(i.pid).stock += i.qty; S.movements.push({pid: i.pid, qty: i.qty, reason: 'Cancelled', note: `Returned from #${o.no}`, at: now(), by: 'Kasa'}); }
  return true;
}
let fresh = null;
const A = {
  more() { S.ui.drawer = null; go('#/more'); },
  open(d) { S.ui.drawer = {kind: d.kind, id: d.id}; S.ui.cancelFor = null; if (d.kind === 'order') O(d.id).lit = false; render(); },
  close() { S.ui.drawer = null; S.ui.cancelFor = null; render(); },
  otab(d) { S.ui.orderTab = d.t; render(); },
  pcat(d) { S.ui.productCat = d.t; render(); },
  ptab(d) { S.ui.payTab = d.t; S.ui.rejectFor = null; render(); },
  adv(d) {
    const o = O(d.id);
    if (d.to === 'out') { const sel = $('#rider-' + o.id); o.rider = S.riders.find(r => r.name === (sel ? sel.value : 'Kwesi')); }
    if (moveOrder(o, d.to)) { fresh = o.id; toast(`#${o.no} is now ${d.to === 'delivered' && o.fulfil === 'pickup' ? 'collected' : LABEL[d.to].toLowerCase()}. ${firstName(o.cid)} got a WhatsApp update.`); }
    render();
  },
  kitchen(d) {
    const o = O(d.id);
    if (d.to === 'handed') { if (o.fulfil === 'pickup') moveOrder(o, 'delivered'); else { o.rider = S.riders[0]; moveOrder(o, 'out'); } toast(`#${o.no} handed over.`); }
    else { moveOrder(o, d.to); toast(`#${o.no} is ${LABEL[d.to].toLowerCase()}.`); }
    render();
  },
  cancel1(d) { S.ui.cancelFor = d.id; render(); },
  cancel0() { S.ui.cancelFor = null; render(); },
  cancel2(d) { const o = O(d.id); const why = $('#cr').value; if (moveOrder(o, 'cancelled', {why})) toast(`#${o.no} cancelled. Stock returned.`); S.ui.cancelFor = null; render(); },
  ptoggle(d) { const p = P(d.id); p.on = !p.on; toast(p.on ? `${p.name} is back on the menu.` : `${p.name} hidden from the menu.`); render(); },
  adjust(d) {
    const p = P(d.id); const reason = $('#ar').value; let q = parseInt($('#aq').value, 10);
    if (!q || q < 0) { toast('Enter how many.', true); return; }
    if (reason === 'Wastage') q = -q;
    if (reason === 'Correction') { q = q - p.stock; }
    p.stock = Math.max(0, p.stock + q); if (p.stock > 0 && !p.on && p.id === 'p10') p.on = true;
    S.movements.push({pid: p.id, qty: q, reason, note: reason === 'Correction' ? 'Counted on the shelf' : 'Recorded by Ama', at: now(), by: 'Ama'});
    toast(`${p.name}: now ${p.stock} in stock.`); render();
  },
  saveProduct(d) {
    const name = $('#pn').value.trim(); const price = Math.round(parseFloat($('#pp').value) * 100);
    if (!name || !price) { toast('Add a name and a price.', true); return; }
    if (d.id) { const p = P(d.id); Object.assign(p, {name, price, cat: $('#pc').value, low: parseInt($('#pl').value, 10) || 0, aliases: $('#pa').value.split(',').map(s => s.trim()).filter(Boolean)}); toast('Saved.'); }
    else { const id = 'p' + (S.products.length + 20); const stock = parseInt($('#ps').value, 10) || 0;
      S.products.push({id, name, price, cat: $('#pc').value, stock, low: parseInt($('#pl').value, 10) || 0, aliases: $('#pa').value.split(',').map(s => s.trim()).filter(Boolean), on: stock > 0, sku: ''});
      S.movements.push({pid: id, qty: stock, reason: 'Restock', note: 'Starting stock', at: now(), by: 'Ama'}); toast(`${name} added to your menu.`); }
    S.ui.drawer = null; render();
  },
  saveNote(d) { C(d.id).note = $('#cn').value; S.ui.drawer = null; toast('Note saved.'); render(); },
  sendBroadcast() { S.ui.drawer = null; toast('Promotion queued for 10 customers.'); render(); },
  quick(d) { const r = $('#reply'); r.value = d.t; r.focus(); },
  send(d) {
    const r = $('#reply'); const t = r.value.trim(); if (!t) { r.focus(); return; }
    chatOf(d.cid).msgs.push({dir: 'out', by: 'you', type: 'text', body: t, at: now()}); render(); $('#reply')?.focus();
  },
  dq(d) { const m = chatOf(d.cid).msgs.find(x => x.type === 'draft' && !x.done); const it = m.items[+d.k]; it.qty = Math.max(0, it.qty + (+d.d)); m.items = m.items.filter(i => i.qty > 0); if (!m.items.length) m.items.push({pid: it.pid, qty: 1}); render(); },
  draftNo(d) { const ch = chatOf(d.cid); ch.msgs = ch.msgs.filter(x => !(x.type === 'draft' && !x.done)); ch.tag = null; toast('Okay. Reply to her yourself.'); render(); },
  draftOk(d) {
    const ch = chatOf(d.cid); const m = ch.msgs.find(x => x.type === 'draft' && !x.done);
    for (const i of m.items) { const p = P(i.pid); if (i.qty > p.stock) { toast(`Only ${p.stock} ${p.name} left. Change the quantity first.`, true); return; } }
    const no = Math.max(...S.orders.map(o => o.no)) + 1;
    const o = {id: 'o' + no, no, cid: d.cid, items: m.items.map(i => ({pid: i.pid, qty: i.qty, price: P(i.pid).price})), fee: m.fulfil === 'delivery' ? S.org.fee : 0, status: 'pending', pay: 'awaiting',
      fulfil: m.fulfil, addr: m.addr, placed: now(), history: [{s: 'pending', at: now()}], rider: null, lit: true, source: 'WhatsApp · typed order'};
    for (const i of o.items) { P(i.pid).stock -= i.qty; S.movements.push({pid: i.pid, qty: -i.qty, reason: 'Sale', note: `Reserved for #${no}`, at: now(), by: 'Kasa'}); }
    S.orders.unshift(o); S.org.used++; m.done = no; ch.tag = 'momo';
    say(d.cid, `Thank you ${firstName(d.cid)}! Order #${no}:\n${o.items.map(i => `${i.qty}× ${P(i.pid).name}  ${cedi(i.price * i.qty)}`).join('\n')}${o.fee ? `\nDelivery  ${cedi(o.fee)}` : ''}\nTotal  ${cedi(total(o))}\n\nPay with MoMo to ${S.org.momo.mtn} (Ama's Kitchen), then reply with the Transaction ID.`);
    ch.msgs.push({type: 'proto', body: `Pretend ${firstName(d.cid)} pays and replies with her Transaction ID.`, at: now()});
    toast(`Order #${no} created. Stock set aside.`); render();
  },
  simPay(d) {
    const ch = chatOf(d.cid); const pm = ch.msgs.find(x => x.type === 'proto' && !x.done); if (pm) pm.done = true;
    const o = S.orders.find(x => x.cid === d.cid && x.status === 'pending');
    ch.msgs.push({dir: 'in', type: 'text', body: 'Paid! ID 60219844710', at: now()});
    o.pay = 'submitted'; o.lit = true;
    S.payments.push({id: 'pay' + o.no, oid: o.id, net: 'MTN', ref: '60219844710', payer: C(d.cid).phone, claimed: total(o), status: 'submitted', at: now()});
    toast(`${firstName(d.cid)} sent a MoMo payment to check.`); render();
  },
  payOk(d) {
    const p = S.payments.find(x => x.id === d.id); const o = O(p.oid);
    p.status = 'verified'; p.by = 'Ama'; o.pay = 'paid';
    say(o.cid, `Payment of ${cedi(p.claimed)} received. Thank you!`);
    if (o.status === 'pending') moveOrder(o, 'confirmed');
    const ch = chatOf(o.cid); if (ch && ch.tag === 'momo') ch.tag = null;
    toast(`Verified. Order #${o.no} confirmed.`); render();
  },
  payNoAsk(d) { S.ui.rejectFor = d.id; render(); },
  payNoCancel() { S.ui.rejectFor = null; render(); },
  payNo(d) {
    const p = S.payments.find(x => x.id === d.id); const o = O(p.oid); const why = $('#rr').value;
    p.status = 'rejected'; p.why = why; p.by = 'Ama'; o.pay = 'awaiting'; S.ui.rejectFor = null;
    say(o.cid, `We couldn't confirm your payment for order #${o.no} (${why.toLowerCase()}). Please check and send the correct Transaction ID, or pay ${cedi(total(o))} to ${S.org.momo.mtn}.`);
    toast(`Rejected. ${firstName(o.cid)} was asked to pay again.`); render();
  },
  food() { S.org.foodMode = !S.org.foodMode; toast(S.org.foodMode ? 'Food mode on. Kitchen added.' : 'Food mode off.'); render(); },
  menuBot() { S.org.menuBot = !S.org.menuBot; render(); },
  freeText() { S.org.freeText = !S.org.freeText; render(); },
  askRef() { S.org.askRef = !S.org.askRef; render(); },
  saved() { toast('Saved.'); },
  invite() { const v = $('#inv').value.trim(); if (!v) { toast('Enter a phone number or email.', true); return; } S.staff.push({name: v, role: $('#invr').value, contact: v, status: 'Invited'}); toast('Invite sent.'); render(); },
  disc1() { S.ui.confirmDisconnect = true; render(); },
  disc0() { S.ui.confirmDisconnect = false; render(); },
  disc2() { S.org.wa = false; S.ui.confirmDisconnect = false; toast('WhatsApp disconnected.'); render(); },
  checkout(d) { S.ui.drawer = {kind: 'checkout', id: d.id, method: 'MoMo'}; render(); },
  method(d) { S.ui.drawer.method = d.m; render(); },
  pay() {
    const dr = S.ui.drawer; dr.busy = true; render();
    setTimeout(() => { dr.busy = false; dr.done = true; S.org.plan = dr.id; toast(`Plan changed to ${PLANS.find(p => p.id === dr.id).name}.`); render(); }, 1300);
  },
  obCat(d) { S.ob.cat = d.t; S.org.foodMode = d.t === 'food'; render(); },
  meta() { S.ob.meta = 1; render(); },
  meta2() { S.ob.meta = 2; render(); },
  meta3() { S.ob.meta = 3; render(); setTimeout(() => { S.ob.meta = 0; S.ob.wa = true; S.org.wa = true; toast('WhatsApp connected.'); render(); }, 1400); },
  metaX() { S.ob.meta = 0; render(); },
  obDone() { if (S.ob.name.trim()) S.org.name = S.ob.name.trim(); },
};
function vMore() {
  const items = navItems().filter(([id]) => !['today', 'chats', 'orders', 'payments'].includes(id));
  return `<div class="view"><div class="ph"><h1>More</h1></div><div class="list">${items.map(([id, l, icon]) => `<a class="li" style="grid-template-columns:24px 1fr auto;text-decoration:none;color:inherit" href="#/${id}">${ic(icon)}<span>${l}</span>${ic('arrow')}</a>`).join('')}
    <a class="li" style="grid-template-columns:24px 1fr auto;text-decoration:none;color:inherit" href="#/onboarding/1">${ic('spark')}<span>Replay onboarding</span>${ic('arrow')}</a></div></div>`;
}

/* ------------------------------- render -------------------------------- */
const app = $('#app');
function render() {
  const r = route();
  const keepScroll = $('#scroll')?.scrollTop ?? 0;
  const sameView = render.last === location.hash;
  if (r.view === 'onboarding') { app.innerHTML = vOnboarding(r.arg); document.title = 'Set up Kasa'; return; }
  const V = {today: vToday, chats: () => vChats(r.arg), orders: vOrders, products: vProducts, customers: vCustomers, payments: vPayments, kitchen: vKitchen, settings: () => vSettings(r.arg), more: vMore};
  const body = (V[r.view] || vToday)();
  app.innerHTML = shell(r, body);
  document.title = `${({today: 'Today', chats: 'Chats', orders: 'Orders', products: 'Products', customers: 'Customers', payments: 'MoMo checks', kitchen: 'Kitchen', settings: 'Settings', more: 'More'})[r.view] || 'Today'} · Kasa`;
  if (sameView) $('#scroll').scrollTop = keepScroll;
  const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight;
  if (r.view === 'chats') $('#scroll').style.overflow = 'hidden';
  if (fresh) { document.querySelector(`.o-row[data-id="${fresh}"]`)?.classList.add('fresh'); fresh = null; }
  render.last = location.hash;
  tick();
}
function tick() {
  for (const el of document.querySelectorAll('[data-since]')) {
    const s = Math.max(0, Math.floor((now() - +el.dataset.since) / 1000));
    el.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    el.classList.toggle('late', s > 1200 && s <= 1800); el.classList.toggle('very', s > 1800);
  }
}
setInterval(tick, 1000);
document.addEventListener('click', e => {
  const a = e.target.closest('[data-a]'); if (!a) return;
  const link = e.target.closest('a[href]');
  if (link && !link.dataset.a && a.contains(link)) return; // a plain link inside a clickable row wins
  const fn = A[a.dataset.a]; if (!fn) return;
  if (!(a.tagName === 'A' && a.getAttribute('href'))) e.preventDefault();
  fn(a.dataset, a, e);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.ui.drawer) { S.ui.drawer = null; render(); }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.li[data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Enter' && !e.shiftKey && e.target.id === 'reply') { e.preventDefault(); $('.send')?.click(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.filter) { const q = t.value.toLowerCase(); for (const row of document.querySelectorAll('.' + t.dataset.filter + '[data-search]')) row.hidden = !row.dataset.search.toLowerCase().includes(q); }
  if (t.dataset.ob) { S.ob[t.dataset.ob] = t.value;
    if (t.dataset.ob === 'pname' && $('#pv-n')) $('#pv-n').textContent = t.value || 'Your product';
    if (t.dataset.ob === 'pprice' && $('#pv-p')) $('#pv-p').textContent = 'GH₵ ' + (Number(t.value) || 0).toFixed(2); }
});
window.addEventListener('hashchange', () => { S.ui.drawer = null; render(); $('#scroll')?.scrollTo(0, 0); window.scrollTo(0, 0); });
render();
</script>
